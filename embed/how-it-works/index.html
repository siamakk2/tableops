<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResBizAI — Run a restaurant that runs itself (0:30)</title>
<meta name="description" content="Snap the invoice. Inventory, food cost and your daily P&amp;L update themselves. A 30-second look at ResBizAI."/>
<meta name="robots" content="noindex, follow, max-video-preview:-1"/>
<link rel="canonical" href="https://resbizai.com/how-it-works/"/>
<meta name="theme-color" content="#17100b"/>
<link rel="icon" href="/favicon.ico?v=4" sizes="any">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#17100b;overflow:hidden}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:100%;height:100%;max-width:calc(100vh * 9 / 16);margin:0 auto;background:#17100b}
video{width:100%;height:100%;display:block;object-fit:contain;background:#17100b}
.pbtn{position:absolute;left:0;right:0;top:0;bottom:50px;width:auto;height:auto;border:0;background:transparent;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:25%}
.pbtn span{width:78px;height:78px;border-radius:50%;background:#ff4f2e;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 32px rgba(0,0,0,.45);transition:transform .18s}
.pbtn:hover span{transform:scale(1.07)}
.pbtn svg{width:29px;height:29px;fill:#fff;margin-left:5px}
.playing .pbtn{display:none}
.brand{position:absolute;top:12px;right:12px;display:flex;gap:10px;opacity:.94;transition:opacity .25s}
.brand a{color:#fff;text-decoration:none;display:flex;align-items:center;gap:7px;background:rgba(14,9,5,.72);backdrop-filter:blur(6px);padding:8px 13px;border-radius:10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.brand a.cta{background:#ff4f2e}
.brand a:hover{opacity:1;transform:translateY(-1px)}
a:focus-visible,button:focus-visible{outline:3px solid #ff8a63;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <video id="vid" playsinline controls preload="metadata"
         poster="/video/resbizai-how-it-works-poster.jpg"
         aria-label="ResBizAI explainer: snap the invoice, inventory and food cost update themselves, daily P&amp;L by 9 a.m.">
    <source src="/video/resbizai-how-it-works-720.mp4" type="video/mp4">
    <track kind="captions" src="/video/resbizai-how-it-works.en.vtt" srclang="en" label="English">
    Your browser cannot play this video. <a href="https://resbizai.com/how-it-works/">Read the transcript</a>.
  </video>
  <button class="pbtn" id="pbtn" type="button" aria-label="Play the 30-second ResBizAI demo"><span><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span></button>
  <div class="brand">
    <a class="cta" href="https://resbizai.com/app" target="_blank" rel="noopener">First month free →</a>
  </div>
</div>
<script>
(function(){
  var v=document.getElementById('vid'), st=document.getElementById('stage'), pb=document.getElementById('pbtn');
  v.removeAttribute('controls');
  function on(){ st.classList.add('playing'); v.controls=true; }
  pb.addEventListener('click',function(){ var pr=v.play(); if(pr&&pr.then){ pr.then(on,on); } else { on(); } });
  v.addEventListener('play',on);
})();
</script>
</body></html>
